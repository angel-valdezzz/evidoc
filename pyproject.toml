[tool.poetry]
name = "evidoc"
version = "0.1.0"
description = "Business-friendly test evidence reporting engine for PDF and DOCX reports."
authors = ["OpenAI Codex <codex@openai.com>"]
readme = "README.md"
packages = [{ include = "evidoc" }]

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.16.0"
textual = "^3.2.0"
reportlab = "^4.2.0"
python-docx = "^1.1.2"
jsonschema = "^4.23.0"
robotframework = "^7.0.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.1.1"

[tool.poetry.group.acceptance.dependencies]
pytest-bdd = "^8.1.0"


[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.7.6"
mkdocs-glightbox = "^0.5.2"
mkdocs-section-index = "^0.3.11"
mkdocs-minify-plugin = "^0.8.0"

[tool.poetry.scripts]
evidoc = "evidoc.interfaces.cli.main:app"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/acceptance"]
markers = [
    "unit: fast isolated unit and component-level tests",
    "acceptance: end-to-end acceptance scenarios expressed in Gherkin",
]
addopts = [
    "--strict-markers",
]
bdd_features_base_dir = "tests/acceptance/features"
