[tool.poetry]
name = "evidoc"
version = "0.1.0"
description = "Business-friendly test evidence reporting engine for PDF and DOCX reports."
authors = ["OpenAI Codex <codex@openai.com>"]
readme = "README.md"
packages = [{ include = "evidoc" }]

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.16.0"
textual = "^3.2.0"
reportlab = "^4.2.0"
python-docx = "^1.1.2"
jsonschema = "^4.23.0"
robotframework = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[tool.poetry.scripts]
evidoc = "evidoc.interfaces.cli.main:app"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
