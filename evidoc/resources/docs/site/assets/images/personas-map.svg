<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de perfiles de uso</title>
  <desc id="desc">Cuatro perfiles: tester funcional, automatizacion, desarrollo y liderazgo tecnico, conectados a Evidoc.</desc>
  <rect width="980" height="540" rx="30" fill="#f8fbfb"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <circle cx="490" cy="270" r="110" fill="#00695c"/>
    <text x="490" y="262" fill="#fff" font-size="34" text-anchor="middle">Evidoc</text>
    <text x="490" y="296" fill="#d5fff8" font-size="18" text-anchor="middle">captura + reporta</text>
    <rect x="70" y="90" width="220" height="100" rx="22" fill="#e0f2f1" stroke="#00897b"/>
    <text x="180" y="135" font-size="24" text-anchor="middle" fill="#004d40">Tester funcional</text>
    <text x="180" y="165" font-size="16" text-anchor="middle" fill="#33695d">lee y valida evidencia</text>
    <rect x="690" y="90" width="220" height="100" rx="22" fill="#fff8e1" stroke="#f9a825"/>
    <text x="800" y="135" font-size="24" text-anchor="middle" fill="#7a5600">Automatizacion</text>
    <text x="800" y="165" font-size="16" text-anchor="middle" fill="#7a5600">integra captura</text>
    <rect x="70" y="350" width="220" height="100" rx="22" fill="#eceff1" stroke="#607d8b"/>
    <text x="180" y="395" font-size="24" text-anchor="middle" fill="#263238">Desarrollo</text>
    <text x="180" y="425" font-size="16" text-anchor="middle" fill="#455a64">depura contratos</text>
    <rect x="690" y="350" width="220" height="100" rx="22" fill="#fff3e0" stroke="#fb8c00"/>
    <text x="800" y="395" font-size="24" text-anchor="middle" fill="#8d4f00">Liderazgo QA</text>
    <text x="800" y="425" font-size="16" text-anchor="middle" fill="#8d4f00">gobierna el uso</text>
    <path d="M290 140c85 10 122 40 147 85" fill="none" stroke="#00897b" stroke-width="6"/>
    <path d="M690 140c-85 10 -122 40 -147 85" fill="none" stroke="#f9a825" stroke-width="6"/>
    <path d="M290 400c85 -10 122 -40 147 -85" fill="none" stroke="#607d8b" stroke-width="6"/>
    <path d="M690 400c-85 -10 -122 -40 -147 -85" fill="none" stroke="#fb8c00" stroke-width="6"/>
  </g>
</svg>
